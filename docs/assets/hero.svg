<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">ultimatehuman — Multiply your productivity by 80×. No AI slop. By design.</title>
  <desc id="desc">The founder reports about 100 tickets reviewed in 5 hours. The 80× comparison uses 80 estimated workdays versus one day of human review in the founding workflow, not a benchmark of this release. AI investigates, evidence is checked, and a human decides.</desc>
  <rect width="1200" height="510" rx="20" fill="#101712"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="44" y="36" width="36" height="36" rx="10" fill="#d3ff5f"/>
    <circle cx="62" cy="48.5" r="4.5" fill="#101712"/>
    <path d="M53.5 62a8.5 8.5 0 0 1 17 0v2h-17Z" fill="#101712"/>
    <text x="94" y="62" fill="#f6f7f2" font-size="27" font-weight="700" letter-spacing="-1">ultimatehuman<tspan fill="#d3ff5f">.</tspan></text>
    <text x="1156" y="58" text-anchor="end" fill="#9bab9e" font-size="12" font-weight="600" letter-spacing="2">AUTONOMOUS ENGINEERING</text>

    <text x="44" y="134" fill="#bac6b9" font-size="18" font-weight="600" letter-spacing="2">MULTIPLY YOUR PRODUCTIVITY</text>
    <text x="39" y="239" fill="#d3ff5f" font-size="112" font-weight="750" letter-spacing="-7">80×.</text>
    <path d="M334 154V236" stroke="#344437" stroke-width="2"/>
    <text x="366" y="186" fill="#f6f7f2" font-size="26" font-weight="600">4 months of AI-assisted work</text>
    <text x="366" y="223" fill="#bac6b9" font-size="26">→ 1 day of human decisions.</text>

    <path d="M44 272H1156" stroke="#344437"/>
    <text x="42" y="344" fill="#f6f7f2" font-size="65" font-weight="750" letter-spacing="-2.5">No AI slop. By design.</text>
    <text x="46" y="382" fill="#bac6b9" font-size="20">AI investigates. Evidence is checked. You make the call.</text>
    <rect x="44" y="411" width="1112" height="49" rx="6" fill="#d3ff5f"/>
    <text x="66" y="442" fill="#101712" font-size="20" font-weight="750" letter-spacing=".5">AI CANNOT APPROVE ITS OWN WORK.</text>
    <text x="46" y="490" fill="#9bab9e" font-size="13">Founder's reported workflow result · 80× uses an estimated historical baseline · Method and release scope below</text>
  </g>
</svg>
