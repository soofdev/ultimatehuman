<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">From a production signal to a human decision</title>
  <desc id="desc">PostHog, Datadog, and repository code feed an investigation. Evidence is checked before a finding reaches your review queue.</desc>
  <rect width="1200" height="230" rx="16" fill="#f4f6ef"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="34" fill="#617055" font-size="12" font-weight="600" letter-spacing="2">THE PIPELINE · AVAILABLE TODAY</text>
    <g fill="#fff" stroke="#dce2d4">
      <rect x="30" y="59" width="255" height="142" rx="12"/>
      <rect x="325" y="59" width="255" height="142" rx="12"/>
      <rect x="620" y="59" width="255" height="142" rx="12"/>
    </g>
    <rect x="915" y="59" width="255" height="142" rx="12" fill="#d3ff5f"/>
    <g stroke="#7e8e70" stroke-width="2" fill="none">
      <path d="M296 130h17m-6-6 6 6-6 6"/>
      <path d="M591 130h17m-6-6 6 6-6 6"/>
      <path d="M886 130h17m-6-6 6 6-6 6"/>
    </g>
    <g fill="#617055" font-size="12" font-weight="600" letter-spacing="1">
      <text x="52" y="89">01 / INPUTS</text>
      <text x="347" y="89">02 / INVESTIGATION</text>
      <text x="642" y="89">03 / EVIDENCE</text>
      <text x="937" y="89" fill="#465329">04 / HUMAN</text>
    </g>
    <g fill="#152018" font-size="22" font-weight="650" letter-spacing="-.5">
      <text x="52" y="126">Read the signals</text>
      <text x="347" y="126">Find the cause</text>
      <text x="642" y="126">Check the case</text>
      <text x="937" y="126">Make the call</text>
    </g>
    <g fill="#617055" font-size="15">
      <text x="52" y="157">PostHog · Datadog</text>
      <text x="52" y="180">Repository code</text>
      <text x="347" y="157">Group related failures.</text>
      <text x="347" y="180">Trace the relevant code.</text>
      <text x="642" y="157">Challenge the explanation.</text>
      <text x="642" y="180">Apply the evidence gate.</text>
      <text x="937" y="157" fill="#465329">Inspect the finding.</text>
      <text x="937" y="180" fill="#465329">Accept, dismiss, or hold.</text>
    </g>
  </g>
</svg>
