name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.13.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/**' typecheck
      - run: pnpm release:prepare
      - run: node scripts/workspace-check.mjs
      - run: node scripts/chat-check.mjs
      - run: node scripts/codex-check.mjs
      - run: pnpm exec esbuild scripts/datadog-mapping-check.ts --bundle --platform=node --format=esm --outfile=/tmp/ultimatehuman-datadog-check.mjs
      - run: node /tmp/ultimatehuman-datadog-check.mjs
      - run: pnpm release:check
